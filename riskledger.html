<title>RiskLedger ERM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — left nav rail + working area; nav becomes a top strip on phones. */
:root {
  --bg: #F3F6FA; --surface: #FFFFFF; --surface-2: #EBF0F6; --ink: #142030; --muted: #5A6A7E;
  --line: #D8E0EA; --accent: #2456C4; --accent-ink: #FFFFFF; --accent-soft: #E3EBFA;
  --low: #23935F; --med: #C9950E; --high: #DB6A24; --crit: #CF3434;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --shadow: 0 10px 40px rgba(20, 32, 48, .18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D131B; --surface: #141C27; --surface-2: #1B2532; --ink: #E4EAF2; --muted: #90A0B4;
  --line: #283445; --accent: #7AA2FF; --accent-ink: #0D131B; --accent-soft: #1E2B45;
  --low: #3DBB82; --med: #E3B43A; --high: #F08A4B; --crit: #F06464; --shadow: 0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D131B; --surface: #141C27; --surface-2: #1B2532; --ink: #E4EAF2; --muted: #90A0B4;
  --line: #283445; --accent: #7AA2FF; --accent-ink: #0D131B; --accent-soft: #1E2B45;
  --low: #3DBB82; --med: #E3B43A; --high: #F08A4B; --crit: #F06464; --shadow: 0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 4px; background: var(--surface-2); }
.brand-mark i { border-radius: 2px; }
.brand-name { font-family: var(--font-head); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.brand-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
nav.menu { display: flex; flex-direction: column; gap: 2px; }
nav.menu a { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; }
nav.menu a:hover { background: var(--surface-2); color: var(--ink); }
nav.menu a.on { background: var(--accent-soft); color: var(--accent); }
nav.menu .count { font-family: var(--font-mono); font-size: 12px; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--low); margin-right: 6px; vertical-align: 1px; }
.status-dot.warn { background: var(--med); }

main { padding-block: 24px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head h1 { font-family: var(--font-head); font-weight: 700; font-size: 26px; margin: 0; text-wrap: balance; }
.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 65ch; }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 13px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); }
.btn.danger.armed { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.kpi .val { font-family: var(--font-head); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.alert .val { color: var(--crit); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel h2 { font-family: var(--font-head); font-size: 17px; font-weight: 600; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Heat map */
.heat-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.heat-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.heat { display: grid; grid-template-columns: 92px repeat(5, minmax(0, 1fr)); gap: 4px; }
.heat .ax { font-size: 11px; color: var(--muted); display: flex; align-items: center; line-height: 1.2; }
.heat .ax.x { justify-content: center; text-align: center; padding-top: 4px; }
.cell { aspect-ratio: 1.35; max-width: 100%; border: 0; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; font-family: var(--font-mono); }
.cell .n { font-size: 18px; font-weight: 500; color: var(--ink); }
.cell .s { position: absolute; top: 4px; left: 6px; font-size: 10px; color: var(--muted); }
.cell.empty .n { opacity: 0; }
.cell:hover { outline: 2px solid var(--ink); outline-offset: -2px; }
.b-low { background: color-mix(in srgb, var(--low) 22%, var(--surface)); }
.b-med { background: color-mix(in srgb, var(--med) 26%, var(--surface)); }
.b-high { background: color-mix(in srgb, var(--high) 30%, var(--surface)); }
.b-crit { background: color-mix(in srgb, var(--crit) 32%, var(--surface)); }
.heat-x { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); grid-column: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }

/* Score pill */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill .sc { font-family: var(--font-mono); font-weight: 500; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-low { color: var(--low); background: color-mix(in srgb, var(--low) 13%, transparent); }
.p-med { color: color-mix(in srgb, var(--med) 80%, var(--ink)); background: color-mix(in srgb, var(--med) 16%, transparent); }
.p-high { color: var(--high); background: color-mix(in srgb, var(--high) 14%, transparent); }
.p-crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.p-neutral { color: var(--muted); background: var(--surface-2); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); font-size: 12px; white-space: nowrap; }
.tag.warn { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.mono { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* Lists */
.rows { display: flex; flex-direction: column; }
.rowi { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
.rowi:first-child { border-top: 0; }
.rowi:hover .t { color: var(--accent); }
.rowi .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowi .meta { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; display: flex; }
.bar .track i { height: 100%; }
.bar .num { font-family: var(--font-mono); text-align: right; color: var(--muted); }
.empty-note { color: var(--muted); font-size: 13px; padding: 6px 0; }

/* Tables */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input, .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-width: 0; }
.toolbar input { flex: 1 1 220px; max-width: 320px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 500; }
.chip button { border: 0; background: transparent; cursor: pointer; color: inherit; font-size: 14px; line-height: 1; padding: 0 4px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
td.title { font-weight: 500; max-width: 340px; }
td.title small { display: block; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
.table-empty { padding: 28px; text-align: center; color: var(--muted); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.drawer header h2 { font-family: var(--font-head); font-size: 19px; margin: 0; }
.drawer .body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.drawer footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.drawer footer .spacer { flex: 1; }
.x { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; padding: 4px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .group-lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 10px; width: 100%; }
.field textarea { min-height: 76px; resize: vertical; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.assess { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.assess-head { display: flex; justify-content: space-between; align-items: center; }
.checks { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.checks label { display: flex; gap: 8px; align-items: baseline; font-size: 13px; font-weight: 400; color: var(--ink); }
.err { color: var(--crit); font-size: 13px; }

/* People */
.av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }
.who { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); padding: 8px; margin: 0 -8px 6px; border-radius: 6px; }
.who:hover { background: var(--surface-2); }
.who span { display: flex; flex-direction: column; min-width: 0; }
.who strong { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.person span { overflow: hidden; text-overflow: ellipsis; }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.matrix table { min-width: 860px; }
.matrix tbody tr { cursor: default; }
.yes { color: var(--low); font-weight: 600; }
.ro { color: var(--muted); font-size: 12px; }
.pick-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; max-height: 240px; overflow-y: auto; }
.pick-list:empty { display: none; }
.pick { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; width: 100%; }
.pick:first-child { border-top: 0; }
.pick:hover, .pick.on { background: var(--accent-soft); }
.pick small { color: var(--muted); margin-left: auto; font-size: 12px; }

/* Compliance */
.fw-tabs { flex-wrap: wrap; max-width: 100%; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); min-width: 0; }
.stack i { height: 100%; }
.comp-summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.big-pct { font-family: var(--font-head); font-size: 46px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.big-pct small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 6px; }
.grp-row { display: grid; grid-template-columns: minmax(0, 1.5fr) 36px minmax(0, 2fr) 44px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.grp-row:hover .gname { color: var(--accent); }
.grp-row.on .gname { color: var(--accent); font-weight: 600; }
.grp-row .num { font-family: var(--font-mono); color: var(--muted); text-align: right; }
.req-box { background: var(--surface-2); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.req-box p { margin: 0; }
.imp-section { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.imp-section h3 { margin: 0; font-family: var(--font-head); font-size: 15px; }
.imp-section p { margin: 0; color: var(--muted); font-size: 13px; }
.preview { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.fw-line { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 4px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.fw-line:first-child { border-top: 0; }
.fw-line[data-fw-go] { cursor: pointer; }
.fw-line[data-fw-go]:hover strong { color: var(--accent); }
.fw-line .num { font-family: var(--font-mono); text-align: right; }

@media (max-width: 1080px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
  nav.menu { flex-direction: row; overflow-x: auto; gap: 4px; }
  nav.menu a { white-space: nowrap; gap: 8px; }
  .rail-foot { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .heat { grid-template-columns: 64px repeat(5, minmax(0, 1fr)); }
  .cell .s { display: none; }
  .pair { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <i style="background:var(--med)"></i><i style="background:var(--high)"></i><i style="background:var(--crit)"></i>
        <i style="background:var(--low)"></i><i style="background:var(--med)"></i><i style="background:var(--high)"></i>
        <i style="background:var(--low)"></i><i style="background:var(--low)"></i><i style="background:var(--med)"></i>
      </div>
      <div><div class="brand-name">RiskLedger</div><div class="brand-sub">Enterprise risk</div></div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="rail-foot">
      <div id="who"></div>
      <div id="conn"><span class="status-dot warn"></span>Connecting…</div>
      <div>Risk appetite: residual score ≤ 9</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- Reference data ---------- */
const L_LABELS = ["", "Rare", "Unlikely", "Possible", "Likely", "Almost certain"];
const I_LABELS = ["", "Insignificant", "Minor", "Moderate", "Major", "Severe"];
const APPETITE = 9;
const BAND_NAME = { low: "Low", med: "Medium", high: "High", crit: "Critical" };
const band = s => s >= 16 ? "crit" : s >= 10 ? "high" : s >= 5 ? "med" : "low";
const CATEGORIES = ["Strategic", "Operational", "Financial", "Compliance", "IT & Cyber", "Reputational", "Health & Safety"];

const ENTITIES = {
  risks: { prefix: "R", one: "risk", title: "Risk register", fields: [
    { k: "title", label: "Risk title", type: "text", req: true },
    { k: "description", label: "Description (cause → event → consequence)", type: "textarea" },
    { pair: [{ k: "category", label: "Category", type: "select", opts: CATEGORIES }, { k: "owner", label: "Risk owner", type: "text" }] },
    { assess: "inherent", label: "Inherent risk (before controls)" },
    { assess: "residual", label: "Residual risk (after controls)" },
    { pair: [{ k: "treatment", label: "Treatment", type: "select", opts: ["Mitigate", "Accept", "Transfer", "Avoid"] },
             { k: "status", label: "Status", type: "select", opts: ["Open", "In treatment", "Monitoring", "Closed"] }] },
    { k: "reviewDate", label: "Next review", type: "date" },
    { k: "controlIds", label: "Linked controls", type: "controls" },
  ]},
  controls: { prefix: "C", one: "control", title: "Control library", fields: [
    { k: "name", label: "Control name", type: "text", req: true },
    { k: "description", label: "How the control works", type: "textarea" },
    { pair: [{ k: "type", label: "Type", type: "select", opts: ["Preventive", "Detective", "Corrective", "Directive"] },
             { k: "nature", label: "Nature", type: "select", opts: ["Manual", "Automated", "IT-dependent manual"] }] },
    { pair: [{ k: "owner", label: "Control owner", type: "text" },
             { k: "frequency", label: "Frequency", type: "select", opts: ["Continuous", "Daily", "Weekly", "Monthly", "Quarterly", "Annually", "Ad hoc"] }] },
    { pair: [{ k: "lastTested", label: "Last tested", type: "date" },
             { k: "result", label: "Test result", type: "select", opts: ["Not tested", "Effective", "Partially effective", "Ineffective"] }] },
  ]},
  actions: { prefix: "A", one: "action", title: "Treatment actions", fields: [
    { k: "title", label: "Action", type: "text", req: true },
    { k: "riskId", label: "Risk being treated", type: "risk" },
    { pair: [{ k: "owner", label: "Action owner", type: "text" }, { k: "dueDate", label: "Due date", type: "date" }] },
    { k: "status", label: "Status", type: "select", opts: ["Not started", "In progress", "Done"] },
    { k: "notes", label: "Progress notes", type: "textarea" },
  ]},
  exceptions: { prefix: "E", one: "exception", title: "Risk exception register", fields: [
    { k: "title", label: "Exception", type: "text", req: true },

function dashboardHtml() {
  const open = state.risks.filter(r => r.status !== "Closed");
  const hiRes = open.filter(r => score(r, "residual") >= 10).length;
  const above = open.filter(r => score(r, "residual") > APPETITE).length;
  const overdue = state.actions.filter(actionOverdue).length;
  const tested = state.controls.filter(c => c.result && c.result !== "Not tested");
  const eff = tested.length ? Math.round(100 * tested.filter(c => c.result === "Effective").length / tested.length) : null;
  const openInc = state.incidents.filter(i => i.status !== "Closed");
  const loss = state.incidents.reduce((s, i) => s + num(i.loss), 0);
  const exList = { active: state.exceptions.filter(exActive).length, soon: state.exceptions.filter(exExpiringSoon).length,
    expired: state.exceptions.filter(e => exState(e) === "Expired").length };
  const openF = state.findings.filter(findingOpen), overdueF = openF.filter(findingOverdue).length, extF = openF.filter(f => isExternal(f.source)).length;

  const kpis = `<div class="kpis">
    <div class="kpi"><span class="lbl">Open risks</span><span class="val">${open.length}</span><span class="sub">${state.risks.length - open.length} closed</span></div>
    <div class="kpi ${hiRes ? "alert" : ""}"><span class="lbl">High / critical</span><span class="val">${hiRes}</span><span class="sub">residual score ≥ 10</span></div>
    <div class="kpi ${above ? "alert" : ""}"><span class="lbl">Above appetite</span><span class="val">${above}</span><span class="sub">residual &gt; ${APPETITE}</span></div>
    <div class="kpi ${overdue ? "alert" : ""}"><span class="lbl">Overdue actions</span><span class="val">${overdue}</span><span class="sub">${state.actions.filter(a => a.status !== "Done").length} still open</span></div>
    <div class="kpi"><span class="lbl">Controls effective</span><span class="val">${eff === null ? "—" : eff + "%"}</span><span class="sub">${tested.length} of ${state.controls.length} tested</span></div>
    <div class="kpi ${exList.expired ? "alert" : ""}"><span class="lbl">Active exceptions</span><span class="val">${exList.active}</span><span class="sub">${exList.expired ? `${exList.expired} expired · ` : ""}${exList.soon} expire in 30 days</span></div>
    <div class="kpi ${overdueF ? "alert" : ""}"><span class="lbl">Open audit findings</span><span class="val">${openF.length}</span><span class="sub">${overdueF} overdue · ${extF} external</span></div>
    <div class="kpi"><span class="lbl">Open incidents</span><span class="val">${openInc.length}</span><span class="sub">${loss.toLocaleString()} total loss</span></div>
  </div>`;

  // Heat map: rows impact 5→1, columns likelihood 1→5
  const counts = {};
  open.forEach(r => { const l = num(r[ui.heatBasis + "L"]), i = num(r[ui.heatBasis + "I"]); if (l && i) counts[l + "-" + i] = (counts[l + "-" + i] || 0) + 1; });
  let cells = "";
  for (let i = 5; i >= 1; i--) {
    cells += `<div class="ax">${i} · ${I_LABELS[i]}</div>`;
    for (let l = 1; l <= 5; l++) {
      const n = counts[l + "-" + i] || 0, s = l * i;
      cells += `<button class="cell b-${band(s)} ${n ? "" : "empty"}" data-cell="${l}-${i}" aria-label="Likelihood ${l}, impact ${i}: ${n} risks"><span class="s">${s}</span><span class="n">${n}</span></button>`;
    }
  }
  cells += `<div></div>` + [1, 2, 3, 4, 5].map(l => `<div class="ax x">${l}<br>${L_LABELS[l]}</div>`).join("");
  const heat = `<section class="panel">
    <div class="panel-head"><h2>Risk heat map</h2>
      <div class="seg" role="group" aria-label="Score basis">
        <button data-basis="inherent" class="${ui.heatBasis === "inherent" ? "on" : ""}">Inherent</button>
        <button data-basis="residual" class="${ui.heatBasis === "residual" ? "on" : ""}">Residual</button></div></div>
    <div class="heat-wrap"><div class="heat-y">Impact</div><div class="heat">${cells}</div><div></div><div class="heat-x">Likelihood</div></div>
    <div class="legend"><span><i class="b-low"></i>Low 1–4</span><span><i class="b-med"></i>Medium 5–9</span><span><i class="b-high"></i>High 10–15</span><span><i class="b-crit"></i>Critical 16–25</span><span>Click a cell to see its risks</span></div>
  </section>`;

  const top = [...open].sort((a, b) => score(b, "residual") - score(a, "residual")).slice(0, 6);
  const topHtml = `<section class="panel"><div class="panel-head"><h2>Top residual risks</h2><a href="#risks" class="mono">View register →</a></div>
    <div class="rows">${top.length ? top.map(r => `<div class="rowi" data-open="risks:${r.id}"><span class="mono">${esc(r.ref)}</span>
      <div style="min-width:0"><div class="t">${esc(r.title)}</div><div class="meta">${esc(r.category || "Uncategorised")} · ${esc(r.owner || "No owner")}</div></div>${pill(score(r, "residual"))}</div>`).join("")
      : `<div class="empty-note">No open risks yet. Add one from the risk register.</div>`}</div></section>`;

  const due = state.actions.filter(a => a.status !== "Done").sort((a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999")).slice(0, 6);
  const dueHtml = `<section class="panel"><div class="panel-head"><h2>Actions by due date</h2><a href="#actions" class="mono">All actions →</a></div>
    <div class="rows">${due.length ? due.map(a => `<div class="rowi" data-open="actions:${a.id}"><span class="mono">${esc(a.ref)}</span>
      <div style="min-width:0"><div class="t">${esc(a.title)}</div><div class="meta">${esc(a.owner || "No owner")} · ${a.riskId ? riskRef(a.riskId) : "No linked risk"}</div></div>
      <span class="tag ${actionOverdue(a) ? "warn" : ""}">${actionOverdue(a) ? "Overdue · " : ""}${fmtDate(a.dueDate)}</span></div>`).join("")
      : `<div class="empty-note">No open actions.</div>`}</div></section>`;

  const A = assessMap();
  const fwsSorted = [...state.frameworks].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const compHtml = `<section class="panel"><div class="panel-head"><h2>Compliance by framework</h2><a href="#compliance" class="mono">Compliance →</a></div>
    <div>${fwsSorted.length ? fwsSorted.map(fw => { const s = stats(fwStatus(fw, A));
      return `<div class="fw-line" data-fw-go="${esc(fw.id)}"><strong>${esc(fw.name)}</strong><span class="num">${s.pct === null ? "—" : s.pct + "%"}</span>${stackBar(s)}<span></span><span class="meta">${s.assessed} of ${s.total} assessed · ${state.findings.filter(f => findingOpen(f) && String(f.reqKey || "").startsWith(fw.id + "~")).length} open findings</span></div>`; }).join("")
      : `<div class="empty-note">No frameworks yet. Import NIST CSF 2.0 or CIS Controls on the Compliance page.</div>`}</div></section>`;

  const cats = CATEGORIES.map(c => { const rs = open.filter(r => r.category === c); return { c, rs }; }).filter(x => x.rs.length);
  const maxC = Math.max(1, ...cats.map(x => x.rs.length));
  const catHtml = `<section class="panel"><div class="panel-head"><h2>Open risks by category</h2></div>
    <div class="bars">${cats.length ? cats.map(({ c, rs }) => {
      const parts = ["crit", "high", "med", "low"].map(b => [b, rs.filter(r => band(score(r, "residual")) === b && score(r, "residual")).length]);
      return `<div class="bar"><span>${esc(c)}</span><div class="track" style="width:${(rs.length / maxC) * 100}%">${parts.map(([b, n]) => n ? `<i style="flex:${n};background:var(--${b})" title="${BAND_NAME[b]}: ${n}"></i>` : "").join("")}${rs.filter(r => !score(r, "residual")).length ? `<i style="flex:${rs.filter(r => !score(r, "residual")).length};background:var(--line)"></i>` : ""}</div><span class="num">${rs.length}</span></div>`;
    }).join("") : `<div class="empty-note">Categories appear here once risks are added.</div>`}</div></section>`;

  return `<div class="page-head"><div><h1>Risk dashboard</h1><p>Where the organisation's exposure sits today, measured against a residual appetite of ${APPETITE}.</p></div>
    ${canDo("risks") ? `<button class="btn primary" data-new="risks">New risk</button>` : ""}</div>
    ${kpis}<div class="grid-2">${heat}<div style="display:flex;flex-direction:column;gap:20px;min-width:0">${topHtml}${catHtml}</div></div><div class="grid-2">${dueHtml}${compHtml}</div>`;
}

function complianceHtml() {
  const fws = [...state.frameworks].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const head = `<div class="page-head"><div><h1>Compliance</h1><p>Assess each framework requirement, map it to your controls, and see how compliant you are. Compliance % counts partially compliant as half and leaves out requirements marked not applicable.</p></div>
    ${canDo("frameworks") ? `<button class="btn primary" data-import>Import framework</button>` : ""}</div>`;
  if (!fws.length) {
    const loading = mode !== "local" && !loaded.frameworks;
    return head + `<section class="panel"><h2>${loading ? "Loading frameworks…" : "No frameworks yet"}</h2>${loading ? "" : `<p class="empty-note">Start by importing a framework. NIST CSF 2.0 is built in. CIS Controls v8.1 and other frameworks can be imported from the Excel or CSV file you download from the publisher.</p>${canDo("frameworks") ? `<div><button class="btn primary" data-import>Import framework</button></div>` : ""}`}</section>`;
  }
  if (!fws.find(f => f.id === ui.fw)) ui.fw = fws[0].id;
  const fw = fws.find(f => f.id === ui.fw);
  const A = assessMap();
  const reqs = fw.requirements || [];
  const stOf = r => (A[reqDocKey(fw.id, r.code)] || {}).status || "Not assessed";
  const gName = g => (fw.groups && fw.groups[g]) || g;
  const s = stats(reqs.map(stOf));
  const fwFindings = state.findings.filter(f => String(f.reqKey || "").startsWith(fw.id + "~"));

  const tabs = fws.length > 1 ? `<div class="seg fw-tabs" role="group" aria-label="Framework">${fws.map(f => `<button data-fw="${esc(f.id)}" class="${f.id === fw.id ? "on" : ""}">${esc(f.name)}</button>`).join("")}</div>` : "";
  const summary = `<section class="panel"><div class="panel-head"><div><h2>${esc(fw.name)}${fw.version ? ` <span class="mono">v${esc(fw.version)}</span>` : ""}</h2><div class="meta">${esc(fw.source || "")}</div></div>
      ${canDo("frameworks") ? `<button class="btn danger" type="button" id="fw-del">Remove framework</button>` : ""}</div>
    <div class="comp-summary"><div class="big-pct">${s.pct === null ? "—" : s.pct + "%"}<small>compliant</small></div>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">${stackBar(s)}
        <div class="legend">${REQ_STATUSES.map(k => `<span><i style="background:${ST_COLOR[k]}"></i>${k} <span class="mono">${s.c[k]}</span></span>`).join("")}</div>
        <div class="meta">${s.assessed} of ${s.total} requirements assessed · ${fwFindings.filter(findingOpen).length} open audit findings against this framework</div></div></div></section>`;

  const groups = [...new Set(reqs.map(r => r.group))];
  const grpHtml = `<section class="panel"><div class="panel-head"><h2>By ${fw.id === "nist-csf-2" ? "function" : "control group"}</h2>${ui.grp ? `<span class="chip">${esc(trunc(gName(ui.grp), 30))}<button data-grp="" aria-label="Show all groups">×</button></span>` : ""}</div>
    <div>${groups.map(g => { const gs = stats(reqs.filter(r => r.group === g).map(stOf));
      return `<button class="grp-row ${ui.grp === g ? "on" : ""}" data-grp="${esc(g)}"><span class="gname">${esc(gName(g))}</span><span class="num">${gs.total}</span>${stackBar(gs)}<span class="num">${gs.pct === null ? "—" : gs.pct + "%"}</span></button>`; }).join("")}</div></section>`;

  let rows = reqs;
  if (ui.grp) rows = rows.filter(r => r.group === ui.grp);
  if (ui.cst) rows = rows.filter(r => stOf(r) === ui.cst);
  if (ui.lvl) rows = rows.filter(r => r.level === ui.lvl);
  const q = ui.q.trim().toLowerCase();
  if (q) rows = rows.filter(r => [r.code, r.title, r.category, r.description, (A[reqDocKey(fw.id, r.code)] || {}).owner].some(v => String(v || "").toLowerCase().includes(q)));
  const levels = [...new Set(reqs.map(r => r.level).filter(Boolean))].sort();
  const hasFn = reqs.some(r => r.fn);
  const toolbar = `<input id="q" type="search" placeholder="Search requirements…" value="${esc(ui.q)}">
    <select id="f-grp"><option value="">All groups</option>${groups.map(g => `<option value="${esc(g)}" ${ui.grp === g ? "selected" : ""}>${esc(trunc(gName(g), 40))}</option>`).join("")}</select>
    ${sel("f-cst", "All statuses", REQ_STATUSES, ui.cst)}${levels.length ? sel("f-lvl", "All levels", levels, ui.lvl) : ""}`;
  const table = `<div class="table-wrap">${rows.length ? `<table><thead><tr><th>Code</th><th>Requirement</th><th>${fw.id === "nist-csf-2" ? "Category" : "Group"}</th>${hasFn ? "<th>Function</th>" : ""}${levels.length ? "<th>Level</th>" : ""}<th>Status</th><th>Controls</th><th>Findings</th><th>Owner</th><th>Assessed</th></tr></thead><tbody>
    ${rows.map(r => { const key = reqDocKey(fw.id, r.code), a = A[key] || {}, st = stOf(r);
      const nf = state.findings.filter(f => f.reqKey === key && findingOpen(f)).length;
      return `<tr data-assess="${esc(key)}"><td class="mono">${esc(r.code)}</td><td class="title">${esc(trunc(r.title, 140))}</td>
        <td>${esc(trunc(r.category || gName(r.group), 48))}</td>${hasFn ? `<td>${esc(r.fn || "—")}</td>` : ""}${levels.length ? `<td><span class="tag">${esc(r.level || "—")}</span></td>` : ""}
        <td><span class="pill ${ST_CLS[st]}">${st}</span></td><td class="mono">${(a.controlIds || []).length || "—"}</td>
        <td>${nf ? `<span class="tag warn">${nf} open</span>` : `<span class="mono">—</span>`}</td><td>${esc(a.owner || "—")}</td><td>${fmtDate(a.lastAssessed)}</td></tr>`; }).join("")}
    </tbody></table>` : `<div class="table-empty">No requirements match these filters.</div>`}</div>`;
  return head + tabs + `<div class="grid-2">${summary}${grpHtml}</div><div class="toolbar">${toolbar}</div>${table}`;
}

function usersHtml() {
  const mgr = canManageUsers(), role = myRole();
  const members = [...state.members].sort((a, b) => (a.active === false) - (b.active === false) || personName(a.id).localeCompare(personName(b.id)));
  const head = `<div class="page-head"><div><h1>Users &amp; roles</h1><p>Give each person a role. Roles decide what they can add and change; everyone with access can read every register.</p></div>
    ${mgr ? `<button class="btn primary" data-add-person>Add person</button>` : ""}</div>`;
  const mods = MODULES.filter(m => ROLES[role].edit.includes(m[0])).map(m => m[1]);
  const yours = `<section class="panel"><div class="panel-head"><h2>Your access</h2></div>
    <div class="person">${me.id ? avatar(me.id) : ""}<div style="min-width:0"><strong>${esc(me.id ? personName(me.id) : mode === "local" ? "Demo user" : "Signed out")}</strong>
      <div class="meta">${esc(role)}${me.isOwner ? " · owner of this workspace" : ""}${myMember() && myMember().department ? " · " + esc(myMember().department) : ""}</div></div></div>
    <div class="meta">${canWrite ? (mods.length ? `You can add and change: ${esc(mods.join(", "))}.` : "You can view everything but not change records.") : "Your Share access is view-only, so you can't change records whatever your role."}</div></section>`;
  const how = `<section class="panel"><div class="panel-head"><h2>How access works</h2></div>
    <div class="meta" style="display:flex;flex-direction:column;gap:8px">
      <span><strong>1. Share the workspace.</strong> The owner adds colleagues from the page's Share menu. <em>Contributor</em> lets someone work in RiskLedger, <em>Viewer</em> keeps them read-only whatever their role, and <em>Editor</em> also lets an Admin manage users.</span>
      <span><strong>2. Assign a role here.</strong> People who have opened RiskLedger appear under "Recently opened" when you add a person, or you can search your organisation by name.</span>
      <span><strong>3. Deactivate</strong> leavers instead of deleting them, so their change history keeps a name.</span>
      ${!mgr && canWrite ? `<span>Only Admins with Editor access can change roles.</span>` : ""}</div></section>`;
  const ownerRow = me.isOwner && me.id && !myMember() ? `<tr><td><div class="person">${avatar(me.id)}<span>${esc(personName(me.id))}</span></div></td><td><span class="pill p-low">Admin</span> <span class="tag">Owner</span></td><td>—</td><td><span class="tag">Active</span></td><td>—</td></tr>` : "";
  const table = `<div class="table-wrap">${members.length || ownerRow ? `<table><thead><tr><th>Person</th><th>Role</th><th>Department</th><th>Status</th><th>Added</th></tr></thead><tbody>${ownerRow}
    ${members.map(m => `<tr ${mgr ? `data-member="${esc(m.id)}"` : 'style="cursor:default"'}><td><div class="person">${avatar(m.id)}<span>${esc(personName(m.id))}${m.id === me.id ? " (you)" : ""}</span></div></td>
      <td><span class="pill ${m.role === "Admin" ? "p-low" : m.role === "Viewer" ? "p-neutral" : "p-med"}">${esc(m.role || "Viewer")}</span></td><td>${esc(m.department || "—")}</td>
      <td><span class="${m.active === false ? "tag warn" : "tag"}">${m.active === false ? "Deactivated" : "Active"}</span></td><td>${fmtDate(String(m.addedAt || "").slice(0, 10))}</td></tr>`).join("")}</tbody></table>`
    : `<div class="table-empty">${mode !== "local" && !loaded.members ? "Loading users…" : `No roles assigned yet. Until you add someone, everyone who can edit this page has full access.${mgr ? " Start with <strong>Add person</strong>." : ""}`}</div>`}</div>`;
  const matrix = `<section class="panel"><div class="panel-head"><h2>Roles and permissions</h2><span class="meta">Every role can view every module</span></div>
    <div class="table-wrap matrix"><table><thead><tr><th>Role</th>${MODULES.map(m => `<th>${m[1]}</th>`).join("")}</tr></thead><tbody>
    ${ROLE_NAMES.map(r => `<tr><td><strong>${r}</strong><div class="meta" style="max-width:260px;white-space:normal">${ROLES[r].desc}</div></td>${MODULES.map(m => `<td>${ROLES[r].edit.includes(m[0]) ? `<span class="yes">Edit</span>` : `<span class="ro">View</span>`}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></section>`;
  return head + `<div class="grid-2">${yours}${how}</div>` + table + matrix;
}

let pickId = null;
function openMember(id) {
  if (!canManageUsers()) return;
  drawer = { kind: "members", id }; formKind = "members"; pickId = id || null;
  const m = id ? (byId("members", id) || {}) : {};
  const known = new Set(state.members.map(x => x.id));
  const recent = state.visitors.filter(v => !known.has(v.id)).sort((a, b) => (b.lastSeen || "").localeCompare(a.lastSeen || "")).slice(0, 12);
  const role = m.role || "Risk owner";
  const picker = id ? `<div class="person">${avatar(id)}<strong>${esc(personName(id))}</strong></div>` : `
    <div class="field"><label for="pp-q">Find a colleague</label><input id="pp-q" type="search" autocomplete="off" placeholder="${userNs ? "Type a name or email" : "People search isn't available here"}" ${userNs ? "" : "disabled"}></div>
    <div class="pick-list" id="pp-results"></div>
    ${recent.length ? `<div class="field"><span class="group-lbl">Recently opened RiskLedger</span><div class="pick-list">${recent.map(v => `<button type="button" class="pick" data-pick="${esc(v.id)}">${avatar(v.id)}<span>${esc(personName(v.id))}</span><small>${fmtDate(v.lastSeen)}</small></button>`).join("")}</div></div>` : ""}
    <div class="meta" id="pp-sel">No one selected yet.</div>`;
  document.getElementById("drawer-root").innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">
      <header><div><div class="mono">Users &amp; roles</div><h2 id="dr-title">${id ? "Edit person" : "Add person"}</h2>${m.updatedAt ? `<div class="meta" id="dr-by" data-by="${esc(m.updatedBy || "")}">Last changed ${fmtDate(String(m.updatedAt).slice(0, 10))}</div>` : ""}</div><button class="x" data-close aria-label="Close">×</button></header>
      <form class="body" id="rec-form" novalidate>${picker}
        <div class="field"><label for="m-role">Role</label><select id="m-role">${ROLE_NAMES.map(r => `<option ${r === role ? "selected" : ""}>${r}</option>`).join("")}</select><span class="meta" id="m-role-desc">${ROLES[role].desc}</span></div>
        <div class="field"><label for="m-dept">Department or business unit</label><input id="m-dept" type="text" value="${esc(m.department)}" placeholder="e.g. Finance"></div>
        ${id ? `<div class="field"><label for="m-active">Status</label><select id="m-active"><option ${m.active !== false ? "selected" : ""}>Active</option><option ${m.active === false ? "selected" : ""}>Deactivated</option></select></div>` : ""}
        <div class="meta">They also need this workspace shared with them from the Share menu before they can open it.</div>
        <div class="err" id="form-err" hidden></div></form>
      <footer><button class="btn primary" type="submit" form="rec-form" id="save-btn">${id ? "Save changes" : "Add person"}</button><button class="btn" data-close type="button">Cancel</button><span class="spacer"></span>
        ${id && id !== me.id ? `<button class="btn danger" type="button" id="mem-del">Remove</button>` : ""}</footer>
    </aside>`;
  fillChangedBy();
  const q = document.getElementById("pp-q"); if (q && !q.disabled) q.focus();
}
function renderPicks(hits) {
  const box = document.getElementById("pp-results"); if (!box) return;
  const known = new Set(state.members.map(x => x.id));
  hits.forEach(h => { people[h.id] = h; });
  box.innerHTML = hits.map(h => `<button type="button" class="pick ${h.id === pickId ? "on" : ""}" data-pick="${esc(h.id)}" ${known.has(h.id) ? "disabled" : ""}><img class="av" alt="" src="${esc(h.avatarUrl)}"><span>${esc(h.name)}</span><small>${known.has(h.id) ? "Already added" : h.guest ? "Guest" : ""}</small></button>`).join("");
}
async function saveMember() {
  if (!canManageUsers()) return;
  const id = drawer.id || pickId;
  if (!id) { showErr("Choose a person first."); return; }
  const ex = byId("members", id);
  const role = document.getElementById("m-role").value;
  const act = document.getElementById("m-active");
  if (id === me.id && !me.isOwner && (role !== "Admin" || (act && act.value !== "Active"))) { showErr("You can't remove your own Admin access. Ask another admin to change it."); return; }
  const now = new Date().toISOString();
  const data = { role, department: document.getElementById("m-dept").value.trim(), active: act ? act.value === "Active" : true,
    addedAt: ex?.addedAt || now, addedBy: ex?.addedBy || me.id || "", updatedAt: now, updatedBy: me.id || "" };
  const btn = document.getElementById("save-btn"); btn.disabled = true; btn.textContent = "Saving…";
  try { await putDoc("members", id, data); closeDrawer(); }

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === "," || ch === ";" && !text.slice(0, 2000).includes(",")) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

    last[m[1]] = minor;

}
// CIS export without a header row: control, control title, control description, safeguard, title, description, "Function IG1 IG2 IG3"
function mapCisHeaderless(rows) {
  const data = rows.filter(r => r && /^\d+(\.\d+)?$/.test(String(r[3] ?? "").trim()) && String(r[4] ?? "").trim());
  if (data.length < 10 || !/\bIG[123]\b/.test(String(data[0][6] ?? ""))) return null;
  const groups = {}, reqs = [];
  data.forEach(r => {
    const ctl = String(r[0]).trim(), meta = String(r[6] ?? "").trim();
    groups[ctl] = groups[ctl] || `${ctl} · ${String(r[1]).trim()}`;
    reqs.push({ code: String(r[3]).trim(), title: String(r[4]).trim(), group: ctl, category: groups[ctl], description: String(r[5] ?? "").trim().slice(0, 1200),
      level: /IG1/.test(meta) ? "IG1" : /IG2/.test(meta) ? "IG2" : /IG3/.test(meta) ? "IG3" : "", fn: meta.split(/\s+/)[0] || "" });
  });
  return { reqs: fixExcelCodes(reqs), groups, isCis: true };
}
function mapRows(rows) {
  const cis = mapCisHeaderless(rows); if (cis) return cis;
  const norm = s => String(s ?? "").trim().toLowerCase().replace(/\s+/g, " ");
  const CODE = ["code", "id", "ref", "reference", "cis safeguard", "safeguard", "subcategory id", "requirement id", "control id", "control ref", "clause", "control number"];
  const TITLE = ["title", "name", "requirement", "safeguard title", "control title", "control name", "subcategory", "statement"];
  const GROUP = ["group", "function", "cis control", "domain", "family", "control family", "section", "theme"];
  const DESC = ["description", "guidance", "details", "safeguard description", "control description"];
  for (let h = 0; h < Math.min(rows.length, 15); h++) {
    const hdr = (rows[h] || []).map(norm);
    const find = list => { for (const name of list) { const i = hdr.indexOf(name); if (i >= 0) return i; } return -1; };
    const ci = find(CODE), ti = find(TITLE);
    if (ci < 0 || ti < 0 || ci === ti) continue;
    let gi = find(GROUP); if (gi === ci || gi === ti) gi = -1;
    const di = find(DESC), cati = hdr.indexOf("category"), lvi = hdr.indexOf("level");
    const ig = ["ig1", "ig2", "ig3"].map(x => hdr.indexOf(x));
    const reqs = [], groups = {}, seen = new Set();
    for (const row of rows.slice(h + 1)) {
      const cellOf = i => i >= 0 ? String(row[i] ?? "").trim() : "";
      const code = cellOf(ci), title = cellOf(ti), grp = cellOf(gi);
      if (!code) { if (grp && title) groups[grp] = `${grp} · ${title}`; continue; }
      if (!title || seen.has(code)) continue;
      seen.add(code);
      let level = cellOf(lvi);
      if (!level) ig.forEach((ix, n) => { if (!level && cellOf(ix)) level = "IG" + (n + 1); });
      reqs.push({ code, title: title.slice(0, 600), group: grp || code.split(/[.\-\s]/)[0], category: cellOf(cati), description: cellOf(di).slice(0, 1200), level });
    }
    if (reqs.length) return { reqs: fixExcelCodes(reqs), groups, isCis: hdr.includes("cis safeguard") || hdr.includes("safeguard") };
  }
  return null;
}
async function readImportFile(file) {
  const buf = await file.arrayBuffer();
  if (window.XLSX) {
    const wb = XLSX.read(buf, { type: "array" });
    let best = null;
    for (const name of wb.SheetNames) {
      const m = mapRows(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: false }));
      if (m && (!best || m.reqs.length > best.reqs.length)) best = m;
    }
    return best;
  }
  if (/\.csv$/i.test(file.name)) return mapRows(parseCSV(new TextDecoder().decode(buf)));
  throw new Error("Excel files can't be read right now. Save the sheet as CSV and upload that instead.");
}
async function putDoc(kind, id, data) {
  if (mode === "local") { const ex = byId(kind, id); if (ex) Object.assign(ex, data); else state[kind].push({ id, ...data }); saveLocal(); render(); return; }
  await db.collection(kind).doc(id).set(data);
}
async function saveFramework(id, doc) {
  doc.importedAt = new Date().toISOString(); doc.updatedBy = me.id || "";
  if (JSON.stringify(doc).length > 240000) throw new Error("This framework is too large to import in one go. Split it into files of about 800 requirements or fewer.");
  await putDoc("frameworks", id, doc);
  ui.fw = id; ui.grp = ""; ui.cst = ""; ui.lvl = "";
  closeDrawer();
  if (route() === "compliance") render(); else location.hash = "compliance";
}

function closeDrawer() { drawer = null; document.getElementById("drawer-root").innerHTML = ""; }

function readForm(kind) {
  const out = {};
  const walk = f => {
    if (f.pair) return f.pair.forEach(walk);
    if (f.assess) { out[f.assess + "L"] = num(document.getElementById(`f_${f.assess}L`).value); out[f.assess + "I"] = num(document.getElementById(`f_${f.assess}I`).value); return; }
    if (f.type === "controls") { out.controlIds = [...document.querySelectorAll('input[name="ctrl"]:checked')].map(x => x.value); return; }
    const el = document.getElementById("f_" + f.k);
    out[f.k] = f.type === "number" ? (el.value === "" ? null : num(el.value)) : el.value.trim();
  };
  ENTITIES[kind].fields.forEach(walk);
  return out;
}

async function saveRecord(kind, id, data) {
  const existing = id ? byId(kind, id) : null;
  if (ENTITIES[kind].prefix) data.ref = existing?.ref || nextRef(kind);
  data.createdAt = existing?.createdAt || new Date().toISOString();
  data.updatedAt = new Date().toISOString();
  data.updatedBy = me.id || "";
  data.createdBy = existing?.createdBy || me.id || "";
  if (existing?.example) data.example = true;
  if (mode === "local") {
    if (existing) Object.assign(existing, data); else state[kind].push({ id: id || "local-" + Math.random().toString(36).slice(2, 10), ...data });
    saveLocal(); render(); return;
  }
  const col = db.collection(kind);
  await (id ? col.doc(id) : col.doc()).set(data);
}
async function deleteRecord(kind, id) {
  if (mode === "local") { state[kind] = state[kind].filter(x => x.id !== id); saveLocal(); render(); return; }
  await db.collection(kind).doc(id).delete();
}
function dbMessage(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "The workspace is full. Delete some old records and try again.";
  if (c === "invalid_argument") return "This change couldn't be saved. You may have view-only access.";
  if (c === "revoked" || c === "not_granted") return "Your access to this workspace changed. Reload the page to continue.";
  return "Couldn't save right now. Check your connection and try again.";
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-add-person]")) { openMember(null); return; }
  const mb = t.closest("[data-member]"); if (mb) { openMember(mb.dataset.member); return; }
  const pk = t.closest("[data-pick]"); if (pk && !pk.disabled) {
    pickId = pk.dataset.pick;
    document.querySelectorAll(".pick").forEach(b => b.classList.toggle("on", b.dataset.pick === pickId));
    const s = document.getElementById("pp-sel"); if (s) s.textContent = `Selected: ${personName(pickId)}`;
    return;
  }
  if (t.id === "mem-del" && drawer && drawer.kind === "members") {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirm remove"; return; }
    t.disabled = true;
    deleteRecord("members", drawer.id).then(closeDrawer).catch(err => { showErr(err && err.code === "invalid_argument" ? "Only Admins with Editor access to this workspace can change roles." : dbMessage(err)); t.disabled = false; });
    return;
  }
  const nw = t.closest("[data-new]"); if (nw) { openDrawer(nw.dataset.new, null, nw.dataset.presetReq ? { reqKey: nw.dataset.presetReq } : null); return; }
  const as = t.closest("[data-assess]"); if (as) { openAssessment(as.dataset.assess); return; }
  if (t.closest("[data-import]")) { openImport(); return; }
  if (t.closest("[data-import-nist]")) {
    const btn = t.closest("[data-import-nist]"); btn.disabled = true; btn.textContent = "Adding…";
    saveFramework("nist-csf-2", nistFramework()).catch(err => { showErr(err.message || dbMessage(err)); btn.disabled = false; btn.textContent = "Add NIST CSF 2.0"; });
    return;
  }
  if (t.id === "imp-go" && pendingImport) {
    const name = document.getElementById("imp-name").value.trim();
    if (!name) { showErr("Give the framework a name before importing."); document.getElementById("imp-name").focus(); return; }
    const version = document.getElementById("imp-ver").value.trim();
    const id = (name + "-" + version).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) + "-" + Math.random().toString(36).slice(2, 6);
    t.disabled = true; t.textContent = "Importing…";
    saveFramework(id, { name, version, source: `Imported from ${pendingImport.file}`, groups: pendingImport.groups, requirements: pendingImport.reqs })
      .catch(err => { showErr(err.message || dbMessage(err)); t.disabled = false; t.textContent = "Import requirements"; });
    return;
  }
  const fg = t.closest("[data-fw-go]"); if (fg) { ui.fw = fg.dataset.fwGo; location.hash = "compliance"; return; }
  const fwb = t.closest("[data-fw]"); if (fwb) { Object.assign(ui, { fw: fwb.dataset.fw, grp: "", cst: "", lvl: "", q: "" }); render(); return; }
  const gb = t.closest("[data-grp]"); if (gb) { ui.grp = gb.dataset.grp; render(); return; }
  if (t.id === "fw-del") {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirm: remove framework and its requirements"; return; }
    t.disabled = true;
    deleteRecord("frameworks", ui.fw).then(() => { ui.fw = ""; render(); }).catch(err => { t.disabled = false; t.textContent = dbMessage(err); });
    return;
  }
  const op = t.closest("[data-open]"); if (op) { const [k, id] = op.dataset.open.split(":"); openDrawer(k, id); return; }
  if (t.closest("[data-close]")) { closeDrawer(); return; }
  const b = t.closest("[data-basis]"); if (b) { ui.heatBasis = b.dataset.basis; render(); return; }
  const c = t.closest("[data-cell]"); if (c) { const [l, i] = c.dataset.cell.split("-").map(Number); Object.assign(ui, { cell: { basis: ui.heatBasis, l, i }, q: "", cat: "", status: "", band: "" }); location.hash = "risks"; return; }
  if (t.closest("[data-clear-cell]")) { ui.cell = null; render(); return; }
  if (t.id === "del-btn" && drawer) {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirm delete"; return; }
    const { kind, id } = drawer; t.disabled = true;
    deleteRecord(kind, id).then(closeDrawer).catch(err => { showErr(dbMessage(err)); t.disabled = false; });
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "rec-form" || !drawer) return;
  e.preventDefault();
  const { kind, id } = drawer;
  if (kind === "members") { saveMember(); return; }
  if (!canDo(kind)) return;
  const data = readForm(kind);
  const req = ENTITIES[kind].fields.flatMap(f => f.pair || [f]).find(f => f.req && !data[f.k]);
  if (req) { showErr(`Add a ${req.label.toLowerCase()} before saving.`); document.getElementById("f_" + req.k).focus(); return; }
  const btn = document.getElementById("save-btn"); btn.disabled = true; btn.textContent = "Saving…";
  try { await saveRecord(kind, id, data); closeDrawer(); }
  catch (err) { showErr(dbMessage(err)); btn.disabled = false; btn.textContent = id ? "Save changes" : "Add " + ENTITIES[kind].one; }
});
function showErr(msg) { const el = document.getElementById("form-err"); if (el) { el.textContent = msg; el.hidden = false; } }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.score) { const b = t.dataset.score; document.getElementById("sc_" + b).innerHTML = pill(num(document.getElementById(`f_${b}L`).value) * num(document.getElementById(`f_${b}I`).value)); return; }
  if (t.id === "m-role") { const d = document.getElementById("m-role-desc"); if (d) d.textContent = ROLES[t.value].desc; return; }
  if (t.id === "imp-file" && t.files && t.files[0]) {
    const file = t.files[0], pv = document.getElementById("imp-preview"), go = document.getElementById("imp-go"), er = document.getElementById("form-err");
    er.hidden = true; pv.textContent = "Reading file…"; go.disabled = true; pendingImport = null;
    readImportFile(file).then(m => {
      if (!m) { pv.textContent = ""; showErr("No requirements found. The sheet needs a header row with at least a Code (or Safeguard / ID) column and a Title column."); return; }
      pendingImport = { ...m, file: file.name };
      const nm = document.getElementById("imp-name"), vr = document.getElementById("imp-ver");
      if (!nm.value && m.isCis) { nm.value = "CIS Controls"; if (!vr.value) vr.value = "8.1"; }
      const ng = new Set(m.reqs.map(r => r.group)).size, lv = [...new Set(m.reqs.map(r => r.level).filter(Boolean))];
      pv.innerHTML = `<strong>${m.reqs.length} requirements in ${ng} groups${lv.length ? ` · levels ${esc(lv.join(", "))}` : ""}</strong>${m.reqs.slice(0, 4).map(r => `<span><span class="mono">${esc(r.code)}</span> ${esc(trunc(r.title, 80))}</span>`).join("")}${m.reqs.length > 4 ? `<span>…and ${m.reqs.length - 4} more</span>` : ""}`;
      go.disabled = false;
    }).catch(err => { pv.textContent = ""; showErr(err.message || "This file couldn't be read. Check that it is an Excel or CSV file."); });
    return;
  }
  const map = { "f-cat": "cat", "f-status": "status", "f-band": "band", "f-src": "src", "f-sev": "sev", "f-grp": "grp", "f-cst": "cst", "f-lvl": "lvl" };
  if (map[t.id]) { ui[map[t.id]] = t.value; render(); }
});
let qTimer;
document.addEventListener("focusin", e => { if (e.target.id === "pp-q" && userNs && !e.target.value) userNs.search("").then(renderPicks).catch(() => {}); });
document.addEventListener("input", e => {
  if (e.target.id === "pp-q") { if (userNs) userNs.search(e.target.value.trim()).then(renderPicks).catch(() => {}); return; }
  if (e.target.id !== "q") return;
  ui.q = e.target.value; clearTimeout(qTimer);
  qTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 180);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawer) closeDrawer(); });
window.addEventListener("hashchange", () => { ui.q = ""; ui.status = ""; ui.src = ""; ui.sev = ""; ui.grp = ""; ui.cst = ""; ui.lvl = ""; if (route() !== "risks") { ui.cell = null; ui.cat = ""; ui.band = ""; } closeDrawer(); render(); });

/* ---------- Store ---------- */
// Standalone mode (opened from a file or a plain web host): keep records in this browser's localStorage
const LOCAL_KEY = "riskledger-data-v1";
let localSaved = false;
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Object.fromEntries(KINDS.map(k => [k, state[k]])))); localSaved = true; } catch { localSaved = false; }
}
function startLocal() {
  mode = "local";
  try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) { const d = JSON.parse(raw); KINDS.forEach(k => { if (Array.isArray(d[k])) state[k] = d[k]; }); } localSaved = true; } catch { localSaved = false; }
  KINDS.forEach(k => { loaded[k] = true; });
  render();
}
async function init() {
  render();
  const c = window.claude;
  if (!c || typeof c.use !== "function") { startLocal(); return; }
  try { db = await c.use("db"); } catch { db = null; }
  if (!db) { startLocal(); return; }
  mode = "live";
  try {
    userNs = await c.use("user");
    if (userNs) {
      const w = await userNs.can("data.write"); if (w === false) canWrite = false;
      const v = await userNs.me();
      Object.assign(me, { id: v.id, isOwner: v.isOwner, canEdit: v.canEdit, name: v.name, avatarUrl: v.avatarUrl });
    }
  } catch {}
  // Record that this person opened RiskLedger today, so admins can pick them when assigning roles
  if (me.id && canWrite) {
    const ref = db.collection("visitors").doc(me.id);
    ref.get().then(s => { if (!s.exists || (s.data() || {}).lastSeen !== todayStr) return ref.set({ lastSeen: todayStr }); }).catch(() => {});
  }
  const timer = setTimeout(() => { slowNote = true; render(); }, 10000);
  KINDS.forEach(kind => {
    db.collection(kind).onSnapshot(snap => {
      state[kind] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) loaded[kind] = true;
      if (KINDS.every(k => loaded[k])) { clearTimeout(timer); slowNote = false; }
      render();
    }, err => {
      loaded[kind] = true;
      if (err.code === "revoked" || err.code === "not_granted") canWrite = false;
      render();
    });
  });
  render();
}
init();
</script>
